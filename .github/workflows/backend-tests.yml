name: Backend tests

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: hms
          POSTGRES_USER: hms
          POSTGRES_PASSWORD: hms
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hms -d hms"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        run: python -m pip install -r requirements.txt
        working-directory: backend
      - name: Check Django configuration
        run: python manage.py check
        working-directory: backend
        env:
          HMS_DB_ENGINE: postgresql
          HMS_DB_NAME: hms
          HMS_DB_USER: hms
          HMS_DB_PASSWORD: hms
          HMS_DB_HOST: 127.0.0.1
          HMS_DB_PORT: 5432
          HMS_SECRET_KEY: ci-only-not-for-deployment
      - name: Run backend tests
        run: python manage.py test
        working-directory: backend
        env:
          HMS_DB_ENGINE: postgresql
          HMS_DB_NAME: hms
          HMS_DB_USER: hms
          HMS_DB_PASSWORD: hms
          HMS_DB_HOST: 127.0.0.1
          HMS_DB_PORT: 5432
          HMS_SECRET_KEY: ci-only-not-for-deployment
